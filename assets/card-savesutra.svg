<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-label="SaveSutra: AI second brain for links">
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1" spreadMethod="reflect">
    <stop offset="0" stop-color="#F59E0B"/><stop offset="0.5" stop-color="#EF4444" stop-opacity="0.15"/><stop offset="1" stop-color="#EF4444"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="10s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#EF4444"/></linearGradient>
  <radialGradient id="glow" cx="1" cy="0" r="1">
    <stop offset="0" stop-color="#F59E0B" stop-opacity="0.28"/><stop offset="0.6" stop-color="#EF4444" stop-opacity="0.05"/><stop offset="1" stop-color="#EF4444" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="clip"><rect width="480" height="250" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="480" height="250" fill="#0B1020"/>
  <rect width="480" height="250" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="430" cy="40" r="90" fill="none" stroke="#F59E0B" stroke-opacity="0.12"/>
  <circle cx="430" cy="40" r="130" fill="none" stroke="#EF4444" stroke-opacity="0.08"/>
</g>
<rect x="32" y="30" width="56" height="56" rx="16" fill="url(#tile)"/>

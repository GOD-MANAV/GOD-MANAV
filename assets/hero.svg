<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Manav Yadav. I build tools that turn hours of busywork into one click.">
<style>
  .fade { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .d1 { animation-delay: .1s } .d2 { animation-delay: .3s } .d3 { animation-delay: .55s }
  .pill { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B1A"/><stop offset="1" stop-color="#160B33"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#C4B5FD"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#A78BFA"/><stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.2"/><stop offset="1" stop-color="#F472B6"/>
  </linearGradient>
  <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
  <clipPath id="clip"><rect width="1000" height="340" rx="26"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="340" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity="0.6">
    <ellipse cx="780" cy="70" rx="210" ry="120" fill="#7C3AED"><animate attributeName="cx" values="780;640;780" dur="14s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="930" cy="280" rx="190" ry="110" fill="#0891B2"><animate attributeName="cy" values="280;200;280" dur="11s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="520" cy="330" rx="170" ry="80" fill="#DB2777"><animate attributeName="cx" values="520;660;520" dur="16s" repeatCount="indefinite"/></ellipse>
  </g>
  <rect width="1000" height="340" fill="url(#grid)"/>
  <circle cx="120" cy="40" r="1.2" fill="#ffffff" opacity="0.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3s" repeatCount="indefinite"/></circle><circle cx="310" cy="300" r="1" fill="#ffffff" opacity="0.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4s" repeatCount="indefinite"/></circle><circle cx="480" cy="36" r="1.4" fill="#ffffff" opacity="0.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="5s" repeatCount="indefinite"/></circle><circle cx="650" cy="310" r="1" fill="#ffffff" opacity="0.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.5s" repeatCount="indefinite"/></circle><circle cx="700" cy="60" r="1.6" fill="#ffffff" opacity="0.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.5s" repeatCount="indefinite"/></circle><circle cx="980" cy="40" r="1.2" fill="#ffffff" opacity="0.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="6s" repeatCount="indefinite"/></circle><circle cx="940" cy="320" r="1.3" fill="#ffffff" opacity="0.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="40" cy="300" r="1" fill="#ffffff" opacity="0.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="5.5s" repeatCount="indefinite"/></circle><circle cx="560" cy="120" r="0.9" fill="#ffffff" opacity="0.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.2s" repeatCount="indefinite"/></circle><circle cx="250" cy="120" r="0.8" fill="#ffffff" opacity="0.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="6.3s" repeatCount="indefinite"/></circle>

  <g class="fade d1"><text x="64" y="96" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="15" letter-spacing="4" fill="#94A3B8">HELLO, WORLD. I'M</text></g>
  <g class="fade d2"><text x="60" y="172" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Manav Yadav</text></g>
  <g class="fade d3"><text x="64" y="216" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#E2E8F0">I build tools that turn hours of busywork into one click.</text></g>
  <g class="pill" style="animation-delay:0.90s"><rect x="64" y="246" width="170" height="34" rx="17" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.55"/><text x="149" y="268" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#A78BFA">Chrome Extensions</text></g><g class="pill" style="animation-delay:1.02s"><rect x="244" y="246" width="88" height="34" rx="17" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.55"/><text x="288" y="268" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#22D3EE">AI Apps</text></g><g class="pill" style="animation-delay:1.14s"><rect x="342" y="246" width="112" height="34" rx="17" fill="#F472B6" fill-opacity="0.12" stroke="#F472B6" stroke-opacity="0.55"/><text x="398" y="268" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#F472B6">Automation</text></g><g class="pill" style="animation-delay:1.26s"><rect x="464" y="246" width="96" height="34" rx="17" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-opacity="0.55"/><text x="512" y="268" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#FBBF24">Game Dev</text></g><g class="pill" style="animation-delay:1.38s"><rect x="570" y="246" width="96" height="34" rx="17" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.55"/><text x="618" y="268" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#34D399">Hardware</text></g>

  <g transform="translate(860 170)">
    <circle r="120" fill="url(#core)"/>
    <circle r="62" fill="none" stroke="#A78BFA" stroke-opacity="0.35" stroke-dasharray="4 7"/>
    <circle r="92" fill="none" stroke="#22D3EE" stroke-opacity="0.25"/>
    <circle r="122" fill="none" stroke="#F472B6" stroke-opacity="0.2" stroke-dasharray="2 10"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <circle cx="62" cy="0" r="7" fill="#A78BFA"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="120" to="-240" dur="15s" repeatCount="indefinite"/>
      <circle cx="92" cy="0" r="6" fill="#22D3EE"/><circle cx="-92" cy="0" r="4" fill="#FBBF24"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="200" to="560" dur="24s" repeatCount="indefinite"/>
      <circle cx="122" cy="0" r="5" fill="#F472B6"/><circle cx="0" cy="122" r="3.5" fill="#34D399"/></g>
    <rect x="-38" y="-38" width="76" height="76" rx="20" fill="#0F172A" stroke="url(#edge)" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="28" font-weight="700" fill="#E2E8F0">&lt;/&gt;</text>
  </g>
</g>
<rect x="1" y="1" width="998" height="338" rx="25" fill="none" stroke="url(#edge)" stroke-opacity="0.6" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-label="Phishing Serious Game: Learn to spot phishing by playing">
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1" spreadMethod="reflect">
    <stop offset="0" stop-color="#EC4899"/><stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.15"/><stop offset="1" stop-color="#8B5CF6"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="10s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EC4899"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <radialGradient id="glow" cx="1" cy="0" r="1">
    <stop offset="0" stop-color="#EC4899" stop-opacity="0.28"/><stop offset="0.6" stop-color="#8B5CF6" stop-opacity="0.05"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="clip"><rect width="480" height="250" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="480" height="250" fill="#0B1020"/>
  <rect width="480" height="250" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="430" cy="40" r="90" fill="none" stroke="#EC4899" stroke-opacity="0.12"/>
  <circle cx="430" cy="40" r="130" fill="none" stroke="#8B5CF6" stroke-opacity="0.08"/>
</g>
<rect x="32" y="30" width="56" height="56" rx="16" fill="url(#tile)"/>
<g transform="translate(44 42) scale(1.333)" fill="none" stroke="#0B1020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></g>
<text x="104" y="56" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#F8FAFC">Phishing Serious Game</text>
<text x="104" y="80" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#EC4899">Learn to spot phishing by playing</text>
<text x="32" y="130" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#CBD5E1">A Unity game that trains players to catch</text>
<text x="32" y="154" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#CBD5E1">phishing attacks before they click.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="418" viewBox="0 0 1000 418" role="img" aria-label="About Manav: a builder who automates the boring stuff, currently building SaveSutra.">
<style>
  .ln { animation: type .5s steps(12, end) both; }
  @keyframes type { from { opacity: 0; clip-path: inset(0 100% 0 0) } to { opacity: 1; clip-path: inset(0 0 0 0) } }
</style>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34D399" stop-opacity="0.7"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0.15"/>
  </linearGradient>
  <radialGradient id="glow" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#34D399" stop-opacity="0.16"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1000" height="418" rx="22" fill="#0A0F1C"/>
<rect width="1000" height="418" rx="22" fill="url(#glow)"/>
<path d="M0 22 a22 22 0 0 1 22 -22 h956 a22 22 0 0 1 22 22 v28 h-1000 z" fill="#111827"/>
<circle cx="32" cy="25" r="7" fill="#FF5F57"/><circle cx="56" cy="25" r="7" fill="#FEBC2E"/><circle cx="80" cy="25" r="7" fill="#28C840"/>
<text x="500" y="31" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="14" fill="#64748B">manav@github: ~ (zsh)</text>
<g class="ln" style="animation-delay:0.35s"><text x="40" y="108" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="17"><tspan fill="#34D399">manav@github</tspan><tspan fill="#64748B">:</tspan><tspan fill="#60A5FA">~</tspan><tspan fill="#64748B">$ </tspan><tspan fill="#F8FAFC">whoami</tspan></text></g><g class="ln" style="animation-delay:0.80s"><text x="40" y="138" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="17" fill="#CBD5E1">Manav Yadav. A builder who automates the boring stuff.</text></g><g class="ln" style="animation-delay:1.25s"><text x="40" y="178" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="17"><tspan fill="#34D399">manav@github</tspan><tspan fill="#64748B">:</tspan><tspan fill="#60A5FA">~</tspan><tspan fill="#64748B">$ </tspan><tspan fill="#F8FAFC">cat now.txt</tspan></text></g><g class="ln" style="animation-delay:1.70s"><text x="40" y="208" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="17" fill="#CBD5E1">Building SaveSutra, an AI second brain for everything you save.</text></g><g class="ln" style="animation-delay:2.15s"><text x="40" y="248" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="17"><tspan fill="#34D399">manav@github</tspan><tspan fill="#64748B">:</tspan><tspan fill="#60A5FA">~</tspan><tspan fill="#64748B">$ </tspan><tspan fill="#F8FAFC">ls interests/</tspan></text></g><g class="ln" style="animation-delay:2.60s"><text x="40" y="278" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="17" fill="#22D3EE">ai-agents/</text><text x="168.0" y="278" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="17" fill="#F472B6">browser-extensions/</text><text x="387.79999999999995" y="278" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="17" fill="#FBBF24">game-design/</text><text x="536.1999999999999" y="278" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="17" fill="#A78BFA">hardware/</text></g><g class="ln" style="animation-delay:3.05s"><text x="40" y="318" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="17"><tspan fill="#34D399">manav@github</tspan><tspan fill="#64748B">:</tspan><tspan fill="#60A5FA">~</tspan><tspan fill="#64748B">$ </tspan><tspan fill="#F8FAFC">echo $MOTTO</tspan></text></g><g class="ln" style="animation-delay:3.50s"><text x="40" y="348" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace" font-size="17" font-style="italic" fill="#FBBF24">"Ship it first. Then make it beautiful."</text></g>
<rect x="40" y="374" width="11" height="20" fill="#34D399">
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
</rect>
